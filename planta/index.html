<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}</style>
<title>Planta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap">
<style>
/* Layout: barra lateral de projetos (estilo Notion) + área de trabalho que alterna Quadro / Dividido / Página.
   Superfícies de vidro sobre uma tela de pontos; cores do sistema Apple como paleta viva de desenho. */
:root{
  --bg:#F2F2F7; --surface:#FFFFFF; --surface-2:#F7F7FA; --canvas:#FBFBFD;
  --glass:rgba(255,255,255,.78); --line:rgba(60,60,67,.12); --line-2:rgba(60,60,67,.2);
  --fg:#1D1D1F; --fg-2:#6E6E73; --fg-3:#A1A1A6; --dot:rgba(60,60,67,.16);
  --accent:#007AFF; --accent-soft:rgba(0,122,255,.12); --on-accent:#FFFFFF;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 28px rgba(0,0,0,.08);
  --shadow-lg:0 2px 6px rgba(0,0,0,.06),0 24px 60px rgba(0,0,0,.16);
  --c-ink:#1D1D1F; --c-red:#FF3B30; --c-orange:#FF9500; --c-yellow:#FFCC00; --c-green:#34C759; --c-mint:#00C7BE;
  --c-cyan:#32ADE6; --c-blue:#007AFF; --c-indigo:#5856D6; --c-purple:#AF52DE; --c-pink:#FF2D55; --c-gray:#8E8E93;
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",Roboto,sans-serif;
  --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue","Segoe UI",Roboto,sans-serif;
  --f-hand:"Kalam","Comic Sans MS","Chalkboard SE",cursive;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r-sm:8px; --r:12px; --r-lg:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0B0D; --surface:#1C1C1E; --surface-2:#232326; --canvas:#141416;
  --glass:rgba(32,32,35,.78); --line:rgba(235,235,245,.1); --line-2:rgba(235,235,245,.18);
  --fg:#F5F5F7; --fg-2:#A1A1A6; --fg-3:#6E6E73; --dot:rgba(235,235,245,.13);
  --accent:#0A84FF; --accent-soft:rgba(10,132,255,.2); --on-accent:#FFFFFF;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.4);
  --shadow-lg:0 2px 6px rgba(0,0,0,.4),0 24px 60px rgba(0,0,0,.55);
  --c-ink:#F5F5F7; --c-red:#FF453A; --c-orange:#FF9F0A; --c-yellow:#FFD60A; --c-green:#30D158; --c-mint:#63E6E2;
  --c-cyan:#64D2FF; --c-blue:#0A84FF; --c-indigo:#5E5CE6; --c-purple:#BF5AF2; --c-pink:#FF375F; --c-gray:#98989D;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0B0B0D; --surface:#1C1C1E; --surface-2:#232326; --canvas:#141416;
  --glass:rgba(32,32,35,.78); --line:rgba(235,235,245,.1); --line-2:rgba(235,235,245,.18);
  --fg:#F5F5F7; --fg-2:#A1A1A6; --fg-3:#6E6E73; --dot:rgba(235,235,245,.13);
  --accent:#0A84FF; --accent-soft:rgba(10,132,255,.2); --on-accent:#FFFFFF;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.4);
  --shadow-lg:0 2px 6px rgba(0,0,0,.4),0 24px 60px rgba(0,0,0,.55);
  --c-ink:#F5F5F7; --c-red:#FF453A; --c-orange:#FF9F0A; --c-yellow:#FFD60A; --c-green:#30D158; --c-mint:#63E6E2;
  --c-cyan:#64D2FF; --c-blue:#0A84FF; --c-indigo:#5E5CE6; --c-purple:#BF5AF2; --c-pink:#FF375F; --c-gray:#98989D;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,[contenteditable]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
input{font:inherit;color:inherit}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

#app{display:grid;grid-template-columns:264px minmax(0,1fr);height:100%;transition:grid-template-columns .25s ease}
#app.side-closed{grid-template-columns:0 minmax(0,1fr)}
#app.presenting{grid-template-columns:0 minmax(0,1fr)}

/* ---------- Barra lateral ---------- */
#side{background:var(--surface-2);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;overflow:hidden}
#app.side-closed #side,#app.presenting #side{border-right:0}
.side-in{width:264px;display:flex;flex-direction:column;height:100%;padding:14px 10px 10px max(10px,env(safe-area-inset-left,0px));gap:6px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 10px}
.mark{width:30px;height:30px;border-radius:9px;background:conic-gradient(from 210deg,var(--c-blue),var(--c-purple),var(--c-pink),var(--c-orange),var(--c-yellow),var(--c-green),var(--c-blue));display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.mark svg{width:18px;height:18px;stroke:#fff;stroke-width:1.8;fill:none}
.brand b{font-family:var(--f-display);font-size:17px;letter-spacing:-.01em}
.brand small{display:block;color:var(--fg-2);font-size:11.5px;margin-top:1px}
.brand .sp{flex:1}
.icon-btn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--fg-2);transition:background .15s,color .15s}
.icon-btn:hover{background:var(--line);color:var(--fg)}
.nav{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;color:var(--fg);font-weight:500;text-align:left;width:100%}
.nav:hover{background:var(--line)}
.nav.on{background:var(--surface);box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(0,0,0,.04)}
.nav .count{margin-left:auto;color:var(--fg-3);font-size:12px;font-variant-numeric:tabular-nums}
.search{display:flex;align-items:center;gap:8px;margin:4px 0 6px;padding:7px 9px;border-radius:9px;background:var(--line);color:var(--fg-2)}
.search input{border:0;background:none;outline:none;width:100%;font-size:13px}
.side-h{display:flex;align-items:center;justify-content:space-between;padding:10px 8px 4px;color:var(--fg-2);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.side-h .icon-btn{width:24px;height:24px}
#projList{flex:1;overflow:auto;display:flex;flex-direction:column;gap:1px;margin:0 -4px;padding:0 4px}
.pitem{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px;text-align:left;width:100%;min-width:0}
.pitem:hover{background:var(--line)}
.pitem.on{background:var(--accent-soft)}
.pitem .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pav{width:22px;height:22px;border-radius:7px;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;font-size:11px;font-family:var(--f-display)}
.sdot{width:7px;height:7px;border-radius:50%;flex:none}
.side-empty{color:var(--fg-2);font-size:12.5px;padding:8px}
.side-foot{border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:6px}
.who{display:flex;align-items:center;gap:8px;padding:2px 8px;font-size:12px;color:var(--fg-2);min-width:0}
.who span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who button{font-weight:600;color:var(--accent);padding:2px 6px;border-radius:6px}
.who button:hover{background:var(--accent-soft)}
.save{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--fg-2);padding:2px 8px}
.save i{width:7px;height:7px;border-radius:50%;background:var(--c-green)}
.save.saving i{background:var(--c-orange)}
.save.local i,.save.off i{background:var(--c-gray)}
.save.err i{background:var(--c-red)}
.seg{display:flex;background:var(--line);border-radius:9px;padding:2px;gap:2px}
.seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:5px 10px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--fg-2);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.seg svg.i{width:15px;height:15px}
.foot-row{display:flex;gap:6px;align-items:center}
.foot-row .seg{flex:1}

/* ---------- Principal ---------- */
#main{position:relative;min-width:0;height:100%;overflow:hidden;background:var(--bg)}
#scrim{display:none}

/* Início (kanban) */
#home{height:100%;overflow:auto;padding-block:28px 40px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.home-top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.home-top h1{font-family:var(--f-display);font-size:34px;letter-spacing:-.025em;margin:0;text-wrap:balance}
.home-top p{margin:4px 0 0;color:var(--fg-2);font-size:15px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;font-weight:600;font-size:13.5px;background:var(--surface);box-shadow:0 0 0 1px var(--line);transition:transform .12s,box-shadow .15s}
.btn:hover{box-shadow:0 0 0 1px var(--line-2),var(--shadow)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--accent);color:var(--on-accent);box-shadow:0 4px 14px rgba(0,122,255,.3)}
.btn.danger{background:var(--c-red);color:#fff;box-shadow:none}
.board-cols{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:16px;align-items:start;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surface-2);border-radius:var(--r-lg);padding:10px;min-height:180px;box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .15s,background .15s}
.col.drop{box-shadow:inset 0 0 0 2px var(--accent);background:var(--accent-soft)}
.col-h{display:flex;align-items:center;gap:8px;padding:4px 6px 10px;font-weight:600}
.col-h .n{color:var(--fg-3);font-weight:500;font-variant-numeric:tabular-nums}
.col-h .pill{margin-right:auto}
.cards{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border-radius:14px;padding:14px;box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(0,0,0,.04);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:10px;transition:transform .15s,box-shadow .15s;width:100%}
.card:hover{transform:translateY(-2px);box-shadow:0 0 0 1px var(--line),var(--shadow)}
.card.dragging{opacity:.4}
.card-t{display:flex;gap:10px;align-items:center;min-width:0}
.card-t .pav{width:28px;height:28px;border-radius:9px;font-size:13px}
.card-t b{font-size:14.5px;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .next{color:var(--fg-2);font-size:12.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .next em{font-style:normal;color:var(--fg-3)}
.prog{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--fg-2);font-variant-numeric:tabular-nums}
.bar{flex:1;height:5px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px}
.card-f{display:flex;align-items:center;justify-content:space-between;gap:8px}
.stack{display:flex}
.stack .mono{margin-left:-5px;box-shadow:0 0 0 2px var(--surface)}
.stack .mono:first-child{margin-left:0}
.mono{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:9.5px;font-weight:800;color:#fff;font-family:var(--f-display);letter-spacing:-.02em;flex:none;overflow:hidden}
.mono svg{width:62%;height:62%;fill:currentColor}
.when{font-size:11.5px;color:var(--fg-3)}
.col-empty{border:1.5px dashed var(--line-2);border-radius:12px;padding:18px 12px;text-align:center;color:var(--fg-3);font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.loading{color:var(--fg-2);padding:40px 0;text-align:center}
.welcome{background:var(--surface);border-radius:22px;padding:28px;box-shadow:0 0 0 1px var(--line);max-width:760px}
.welcome h2{font-family:var(--f-display);font-size:24px;letter-spacing:-.02em;margin:0 0 6px}
.welcome p{color:var(--fg-2);margin:0 0 18px;font-size:14.5px;line-height:1.5}

/* ---------- Projeto ---------- */
#proj{height:100%;display:flex;flex-direction:column}
#topbar{height:54px;flex:none;display:flex;align-items:center;gap:10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface)}
#app.presenting #topbar{display:none}
.crumb{display:flex;align-items:center;gap:6px;min-width:0;flex:1}
.crumb button.lnk{color:var(--fg-2);font-weight:500;padding:4px 6px;border-radius:6px}
.crumb button.lnk:hover{background:var(--line);color:var(--fg)}
.crumb .sep{color:var(--fg-3)}
.crumb .cur{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.top-r{display:flex;align-items:center;gap:6px}
.chip-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--fg)}
.chip-btn:hover{background:var(--line)}
.chip-btn.on{background:var(--accent-soft);color:var(--accent)}
#work{flex:1;min-height:0;position:relative;display:grid;grid-template-columns:minmax(0,1fr)}
#work.v-page #boardPane{display:none}
#work.v-board #pagePane{display:none}
#work.v-split{grid-template-columns:minmax(340px,42%) minmax(0,1fr)}
#work.v-split #pagePane{border-right:1px solid var(--line)}
#app.presenting #pagePane{display:none}
#app.presenting #work{grid-template-columns:minmax(0,1fr)}
#app.presenting #boardPane{display:block}

/* ---------- Quadro ---------- */
#boardPane{position:relative;overflow:hidden;background:var(--canvas);min-width:0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.glass{background:var(--glass);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);box-shadow:0 0 0 1px var(--line),var(--shadow);border-radius:14px}
#toolbar{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:5px;max-width:calc(100% - 24px);overflow-x:auto;scrollbar-width:none;z-index:5}
#toolbar::-webkit-scrollbar{display:none}
.tb{position:relative;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--fg);flex:none;transition:background .12s,color .12s}
.tb:hover{background:var(--line)}
.tb.on{background:var(--accent);color:var(--on-accent)}
.tb .k{position:absolute;right:3px;bottom:2px;font-size:8.5px;font-family:var(--f-mono);color:var(--fg-3);line-height:1}
.tb.on .k{color:rgba(255,255,255,.75)}
.tb-sep{width:1px;height:22px;background:var(--line-2);margin:0 4px;flex:none}
#app.presenting:not(.present-edit) .hide-present{display:none}
.show-present{display:none}
#app.presenting .show-present{display:grid}
#app.presenting #toolbar,#app.presenting #zoomBar{opacity:.62;transition:opacity .2s}
#app.presenting #toolbar:hover,#app.presenting #zoomBar:hover,#app.presenting.present-edit #toolbar,#app.presenting #toolbar:focus-within{opacity:1}
#presentEdit.on{background:var(--accent-soft);color:var(--accent)}
#revealBtn{margin-left:4px;background:var(--accent);color:var(--on-accent)}
#revealBtn:hover{background:var(--accent)}
/* vídeo narrado */
#app.video{grid-template-columns:0 minmax(0,1fr)}
#app.video #side{border-right:0}
#app.video #topbar,#app.video #pagePane,#app.video #toolbar,#app.video #zoomBar,#app.video #props,#app.video #ctx,#app.video #hint,#app.video #lib{display:none!important}
#app.video #work{grid-template-columns:minmax(0,1fr)}
#app.video #boardPane{display:block}
#app.video #cv{pointer-events:none}
#bcrumb{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:12px;z-index:7;display:flex;align-items:center;gap:2px;padding:4px 10px 4px 4px;max-width:min(44%,560px);overflow:hidden;white-space:nowrap}
#bcrumb .tb{width:32px;height:32px}
#bcrumb .bc{padding:5px 8px;border-radius:8px;color:var(--fg-2);font-weight:500;font-size:13px;overflow:hidden;text-overflow:ellipsis;max-width:180px}
#bcrumb .bc:hover{background:var(--line);color:var(--fg)}
#bcrumb .sep{color:var(--fg-3);margin:0 2px}
#bcrumb b{font-size:13px;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
#app.video #bcrumb{display:none!important}
@media (max-width:860px){#bcrumb{top:auto;bottom:64px;max-width:calc(100% - 24px)}}
.fs-box{display:inline-flex;align-items:center;gap:2px;background:var(--line);border-radius:8px;padding:2px}
.fs-box input{width:54px;border:0;background:var(--surface);border-radius:6px;text-align:center;padding:5px 2px;font:inherit;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--fg);outline:none}
.fs-box input:focus{box-shadow:0 0 0 2px var(--accent)}
.fs-box button{width:24px;height:26px;border-radius:6px;font-weight:700;color:var(--fg-2)}
.fs-box button:hover{background:var(--surface);color:var(--fg)}
.pop .mi .ico svg.i{width:17px;height:17px}
.bt-sec{margin-top:36px;padding-top:20px;border-top:1px solid var(--line)}
.bt-sec h2{font-family:var(--f-display);font-size:20px;font-weight:650;letter-spacing:-.015em;margin:0 0 2px}
.bt-sec > p{color:var(--fg-2);font-size:13.5px;margin:0 0 14px}
.tg{padding:10px 12px 4px;border-radius:14px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);margin-bottom:10px}
.tg.done{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c-green) 55%,transparent)}
.tg-h{display:flex;align-items:center;gap:8px;font-weight:650;font-size:14.5px;margin-bottom:2px;flex-wrap:wrap}
.tg-h small{color:var(--fg-3);font-weight:500;font-size:12px}
.tg-n{margin-left:auto;color:var(--fg-2);font-size:12.5px;font-variant-numeric:tabular-nums;font-weight:500}
.tg .blk{padding:0}
.tg .add-blk{margin-top:0;font-size:13.5px;padding:4px 2px}
.donepill{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;background:var(--c-green);color:#fff;font-size:11.5px;font-weight:700}
#vstage{position:absolute;inset:0;z-index:8;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 70%,#000 30%)}
#vcv{display:block;border-radius:14px;box-shadow:var(--shadow-lg)}
.addh{position:absolute;z-index:6;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--accent);box-shadow:0 0 0 1.5px var(--accent),var(--shadow);transition:transform .12s,background .12s,color .12s}
.addh:hover{transform:scale(1.15);background:var(--accent);color:var(--on-accent)}
.addh svg.i{width:16px;height:16px;stroke-width:2.2}
#app.video .addh{display:none!important}
.sc-list{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;max-height:260px;overflow:auto}
.sc-row{display:grid;grid-template-columns:24px minmax(0,1fr) minmax(0,190px);gap:10px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.sc-n{width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:11.5px;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.sc-t{font-size:13px;line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

function lum(hex) {
  const n = parseInt(hex.slice(1), 16); const f = (v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; };

function rgba(color, a) {
  let c = (color || '').trim();

function markDirty(id = S.activeId) {

async function writeProject(id, attempt = 0) {
  const p = S.projects.get(id); if (!p) return;
  if (S.mode === 'cloud') {
    const { error } = await S.sb.from('planta_projects').upsert({ id, user_id: S.user.id, data: serialize(p), updated_at: new Date().toISOString() }, { onConflict: 'user_id,id' });
    if (error) { if (attempt === 0 && !/JWT|auth|permission/i.test(error.message)) { await new Promise((r) => setTimeout(r, 1200)); return writeProject(id, 1); } throw { code: /JWT|auth/i.test(error.message) ? 'revoked' : 'unavailable' }; }
    return;
  }
  if (S.mode !== 'db') { saveLocal(); return; }
  try { await S.db.doc('projects/' + id).set(serialize(p)); }
  catch (e) {
    const code = e && e.code;
    if (code === 'unavailable' && attempt === 0) { await new Promise((r) => setTimeout(r, 900 + Math.random() * 900)); return writeProject(id, 1); }
    throw e;
  }
}
async function flush() {
  for (const id of [...S.dirty]) {
    if (S.saving.has(id)) continue;
    S.dirty.delete(id); S.saving.add(id);
    try { await writeProject(id); }
    catch (e) {
      const code = e && e.code;
      if (code === 'quota_exceeded') toast('O espaço do Planta está cheio. Exclua projetos antigos para continuar salvando.');
      else if (code === 'invalid_argument') toast('Este projeto passou de 256 KB. Apague desenhos à mão livre grandes para salvar.');
      else if (code === 'not_granted' || code === 'revoked' || code === 'capability_disabled') { S.readOnly = true; toast('Você está em modo leitura. As mudanças ficam só nesta tela.'); }
      else toast('Não deu para salvar agora. Vou tentar de novo na próxima mudança.');
      setSaveState('err', S.readOnly ? 'Somente leitura' : 'Não salvo');
      S.saving.delete(id);
      return;
    }
    S.saving.delete(id);
  }
  if (S.dirty.size) flush(); else savedLabel();
}

}

function parseJsonLoose(t) {
  try { return JSON.parse(t); } catch {}
  const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/); if (fence) { try { return JSON.parse(fence[1]); } catch {} }
  const a = t.search(/[[{]/), b = Math.max(t.lastIndexOf('}'), t.lastIndexOf(']'));
  if (a >= 0 && b > a) return JSON.parse(t.slice(a, b + 1));
  throw new Error('json');
}

  const { data: { session } } = await sb.auth.getSession();

const NOTE_FOR = { ink: 'gray', red: 'red', orange: 'orange', yellow: 'yellow', green: 'green', mint: 'mint', cyan: 'cyan', blue: 'blue', indigo: 'indigo', purple: 'purple', pink: 'pink', gray: 'gray' };

function buildFunnel(data, dest, originalText) {
  const clean = (t, n = 160) => String(t ?? '').replace(/[—–]/g, ',').replace(/\s+/g, ' ').trim().slice(0, n);
  const nodes = data.nodes.filter((n) => n && n.id != null).slice(0, 14).map((n, i) => ({ ...n, i, id: String(n.id) }));
  const idx = new Map(nodes.map((n) => [n.id, n]));
  const edges = (Array.isArray(data.edges) ? data.edges : []).map((e) => ({ from: String(e.from), to: String(e.to), label: clean(e.label, 24) })).filter((e) => idx.has(e.from) && idx.has(e.to) && e.from !== e.to);
  if (!edges.length) for (let i = 1; i < nodes.length; i++) edges.push({ from: nodes[i - 1].id, to: nodes[i].id, label: '' });
  // seta de volta entre os mesmos dois itens ficaria em cima da de ida: mantém só a de ida
  for (let k = edges.length - 1; k >= 0; k--) { const e = edges[k]; if (idx.get(e.from).i > idx.get(e.to).i && edges.some((o) => o.from === e.to && o.to === e.from)) edges.splice(k, 1); }
  // colunas pelo caminho mais longo, ignorando setas que voltam no fluxo
  const layer = {}; nodes.forEach((n) => (layer[n.id] = 0));
  for (let it = 0; it < nodes.length; it++) {
    let ch = false;
    edges.forEach((e) => { const a = idx.get(e.from), b = idx.get(e.to); if (a.i < b.i && layer[e.to] < layer[e.from] + 1) { layer[e.to] = layer[e.from] + 1; ch = true; } });
    if (!ch) break;
  }
  const cols = {}; nodes.forEach((n) => (cols[layer[n.id]] = cols[layer[n.id]] || []).push(n));
  // projeto novo começa em (0,0); no quadro atual, entra à direita do que já existe
  let ox = 0, oy = 0; const p0 = active();
  if (dest === 'here' && S.els.length) { reindex(); const u = unionBounds(S.els); ox = u.x + u.w + 440; oy = u.y + 230; }
  const els = [], byNode = {}; const ROW = 270, COL = 340;
  let ci = 0;
  Object.keys(cols).map(Number).sort((a, b) => a - b).forEach((L) => {
    const list = cols[L];
    list.forEach((n, r) => {
      const cx = ox + L * COL, cy = oy + (r - (list.length - 1) / 2) * ROW;
      const key = n.tool && TOOLS[n.tool] ? n.tool : null;
      const kind = n.kind === 'start' || n.i === 0 ? 'start' : n.kind === 'goal' || n.i === nodes.length - 1 ? 'goal' : key ? 'tool' : 'step';
      let e;
      if (kind === 'start') e = newEl('note', { w: 230, h: 136, fill: 'yellow', text: clean(n.note || n.name || n.role, 120), fs: 18, font: 'hand' });
      else if (kind === 'goal') e = newEl('ellipse', { w: 200, h: 110, stroke: 'green', fill: 'green', fillStyle: 'hachure', text: clean(n.name, 40), fs: 24, rough: 1, sw: 2, font: 'hand', dash: false });
      else if (key) { e = newEl('tool', { tool: key, show: 'both' }); Object.assign(e, toolSize(e)); e.text = clean(n.role, 60); }
      else { const col = STEP_COLORS[ci++ % STEP_COLORS.length]; e = newEl('rect', { w: 220, h: 88, stroke: col, fill: col, fillStyle: 'solid', text: clean(n.name, 50), fs: 20, rough: 1, sw: 2, font: 'hand', dash: false }); }
      e.x = cx - e.w / 2; e.y = cy - e.h / 2; e.step = n.i; e.say = clean(n.say, 260);
      els.push(e); byNode[n.id] = e;
      if ((kind === 'tool' || kind === 'step') && clean(n.note)) {
        const nc = key ? NOTE_FOR[TOOLS[key].color] || 'yellow' : 'gray';
        const note = newEl('note', { w: 214, h: 112, fill: nc, text: clean(n.note, 110), fs: 16, font: 'hand' });
        note.x = cx - 107; note.y = e.y + e.h + 26; note.step = n.i; note.say = '';
        els.push(note);
      }
    });
  });
  edges.forEach((ed) => {
    const a = byNode[ed.from], b = byNode[ed.to]; const [ax, ay] = center(a), [bx, by] = center(b);
    els.push(newEl('arrow', { x: ax, y: ay, points: [[0, 0], [bx - ax, by - ay]], startId: a.id, endId: b.id, text: ed.label, fs: 16, stroke: b.type === 'ellipse' ? 'green' : 'gray', fill: 'none', rough: 1, sw: 2, font: 'hand', dash: idx.get(ed.from).i > idx.get(ed.to).i }));
  });
  const solid = els.filter((e) => e.type !== 'arrow');
  const minX = Math.min(...solid.map((e) => e.x)), minY = Math.min(...solid.map((e) => e.y));
  const title = newEl('text', { x: minX, y: minY - 170, text: clean(data.title, 60) || 'Funil', fs: 40, font: 'hand', stroke: 'ink' }); measureText(title); title.step = -2;
  const sub = newEl('text', { x: minX + 2, y: minY - 112, text: clean(data.goal, 140), fs: 20, font: 'hand', stroke: 'gray' }); measureText(sub); sub.step = -1; sub.say = '';
  els.unshift(title, sub);
  const tools = [...new Set(nodes.map((n) => n.tool).filter((k) => k && TOOLS[k]))];
  const steps = (Array.isArray(data.steps) ? data.steps : []).map((t) => clean(t, 140)).filter(Boolean).slice(0, 10);
  const mkB = (type, text = '', extra) => Object.assign({ id: uid('b'), type, text }, extra);
  const howBlocks = nodes.map((n) => mkB('bullet', `${clean(n.name || (TOOLS[n.tool] || {}).name, 60)}${n.role ? ': ' + clean(n.role, 80) : ''}`));
  if (dest === 'here' && p0) {
    pushHist(); els.forEach((e) => S.els.push(e));
    p0.blocks.push(mkB('h2', clean(data.title, 60) || 'Funil criado com IA'), mkB('p', clean(data.goal, 200)), ...tools.map((k) => mkB('tool', '', { tool: k })), ...howBlocks, ...steps.map((t) => mkB('todo', t, { checked: false })));

    S.sel = new Set(); changed(); renderPage(); if (S.view === 'page') setView('board');
    requestAnimationFrame(() => { const u = unionBounds(els); const z = clamp(Math.min((W - 160) / u.w, (H - 200) / u.h), 0.2, 1.2); S.cam = { z, x: W / 2 - (u.x + u.w / 2) * z, y: H / 2 + 20 - (u.y + u.h / 2) * z }; req(); });
  } else {
    const p = newProject({ template: 'blank', name: clean(data.title, 60) || 'Projeto criado com IA', status: 'planejando', color: 'purple' });
    p.elements = els; p.intro = clean(data.intro, 240); p.outro = clean(data.outro, 240);
    p.blocks = [mkB('h2', 'Objetivo'), mkB('p', clean(data.goal, 200)), mkB('h2', 'Stack'), ...tools.map((k) => mkB('tool', '', { tool: k })), mkB('h2', 'Como funciona'), ...howBlocks, mkB('h2', 'Etapas'), ...steps.map((t) => mkB('todo', t, { checked: false })), mkB('divider'), mkB('callout', 'Pedido original: ' + clean(originalText, 600))];
    S.projects.set(p.id, p); markDirty(p.id); lsSet('planta.view.' + p.id, 'board'); openProject(p.id);
  }
  toast('Funil criado. Toque em Vídeo para ver ele sendo desenhado e narrado.');
}

const STOP = new Set('a o e as os de da do das dos que pra para com no na nos nas um uma uns umas em por se ele ela eles elas isso esse essa este esta aqui ai aí vai vou é são ser tem mais muito como quando onde depois entao então ja já vc você voces vocês pela pelo sua seu suas seus nao não sim bem tudo cada ate até lá la'.split(' '));

  if (e.type === 'image') return 'Imagem' + (e.text ? ': ' + e.text : e.name ? ': ' + e.name : '');
  if (e.type === 'file') return 'Anexo: ' + (e.name || 'arquivo');

function scriptBlocks() { reindex(); return S.els.filter((e) => !LINEAR.includes(e.type) && e.type !== 'pen' && blockLabel(e)).sort(seqSort); }

  const info = blocks.map((e) => {
    const t = e.type === 'tool' ? TOOLS[e.tool] || {} : null;
    return { e, name: t ? tokens(t.name) : [], words: new Set(tokens(blockLabel(e) + ' ' + (e.text || '') + ' ' + (t ? t.role : '') + ' ' + (e.say || ''))) };
  });

    const w = tokens(seg); const nseg = norm(seg);
    const scored = info.map((x) => {

      if (x.name.length && x.name.every((k) => nseg.includes(k))) sc += 6;
      return { e: x.e, sc };
    }).filter((x) => x.sc > 0).sort((a, b) => b.sc - a.sc);
    let ids = [];
    if (scored.length) { ids = [scored[0].e.id]; scored.slice(1, 3).forEach((x) => x.sc >= 6 && ids.push(x.e.id)); last = ids; }

  box.querySelectorAll('[data-ta]').forEach((b) => (b.onclick = () => { const e = byKey.get(b.dataset.ta); e.tasks.push(newTask()); markDirty(); renderBoardTasks(); focusT(e.id, e.tasks.length - 1); req(); }));
  box.querySelectorAll('[data-tt]').forEach((el) => {
    const e = byKey.get(el.dataset.tt), i = Number(el.dataset.i);
    el.addEventListener('input', () => { const t = readText(el); if (!t) el.innerHTML = ''; e.tasks[i].text = t; markDirty(); req(); });
    el.addEventListener('paste', (ev) => { ev.preventDefault(); document.execCommand('insertText', false, (ev.clipboardData || window.clipboardData).getData('text/plain').replace(/\n+/g, ' ')); });
    el.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter') { ev.preventDefault(); if (!readText(el).trim()) { e.tasks.splice(i, 1); markDirty(); renderBoardTasks(); updateProgress(); req(); return; } e.tasks.splice(i + 1, 0, newTask()); markDirty(); renderBoardTasks(); focusT(e.id, i + 1); req(); }
      else if (ev.key === 'Backspace' && !readText(el)) { ev.preventDefault(); e.tasks.splice(i, 1); markDirty(); renderBoardTasks(); updateProgress(); if (i > 0) focusT(e.id, i - 1, true); req(); }
    });
  });
}

/* ================= Teclado ================= */
const KEYMAP = { v: 'select', 1: 'select', h: 'hand', r: 'rect', 2: 'rect', d: 'diamond', 3: 'diamond', o: 'ellipse', 4: 'ellipse', a: 'arrow', 5: 'arrow', l: 'line', 6: 'line', p: 'pen', 7: 'pen', t: 'text', 8: 'text', n: 'note', 9: 'note', e: 'eraser', 0: 'eraser', k: 'laser' };
window.addEventListener('keydown', (e) => {
  const tg = e.target; const typing = tg && (tg.isContentEditable || /INPUT|TEXTAREA|SELECT/.test(tg.tagName));
  if (S.video) {
    if (e.key === 'Escape') { e.preventDefault(); stopVideo(false); }
    else if (e.key === ' ') { e.preventDefault(); videoPause(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); videoSkip(); }
    return;
  }
  if (e.key === 'Escape' && $('#modal')) return;
  if (typing) return;
  if (S.route !== 'project' || (S.view === 'page' && !S.presenting) || $('#modal')) return;
  const mod = e.metaKey || e.ctrlKey; const k = e.key.toLowerCase();
  if (e.key === ' ' && !S.space) { S.space = true; cv.style.cursor = 'grab'; e.preventDefault(); return; }
  if (mod && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && k === 'y') { e.preventDefault(); redo(); return; }
  if (mod && k === 'd') { e.preventDefault(); duplicateSel(); return; }
  if (mod && k === 'a') { e.preventDefault(); S.sel = new Set(S.els.map((x) => x.id)); renderProps(); req(); return; }
  if (mod && k === 'c') { const s = S.els.filter((x) => S.sel.has(x.id)); if (s.length) S.clip = clone(s); return; }
  if (mod && k === 'v') { if (S.clip) { e.preventDefault(); duplicateSel(clone(S.clip)); } return; }
  if (mod && (k === '=' || k === '+')) { e.preventDefault(); zoomAt(W / 2, H / 2, S.cam.z * 1.2); return; }
  if (mod && k === '-') { e.preventDefault(); zoomAt(W / 2, H / 2, S.cam.z / 1.2); return; }
  if (mod && k === '0') { e.preventDefault(); zoomAt(W / 2, H / 2, 1); return; }
  if (mod && e.key === 'ArrowRight') { e.preventDefault(); addQuick('right'); return; }
  if (mod && e.key === 'ArrowDown') { e.preventDefault(); addQuick('below'); return; }
  if (mod) return;
  if (e.shiftKey && (e.code === 'Digit1')) { e.preventDefault(); fitView(); return; }
  if (e.key === 'Escape') { if (S.stack.length && !S.sel.size) { exitTo(S.stack.length - 1); return; } if (S.presenting) togglePresent(false); else { S.sel.clear(); setTool('select'); } return; }
  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); deleteSel(); return; }
  if (e.key === 'Enter' && S.sel.size === 1) { const el = byId([...S.sel][0]); if (canEdit(el)) { e.preventDefault(); pushHist(); openEditor(el); } return; }
  if (e.key === '?') { openKeysModal(); return; }
  if (S.presenting && e.key === 'ArrowRight' && !S.sel.size) { e.preventDefault(); revealNext(); return; }
  if (e.key.startsWith('Arrow') && S.sel.size) {
    e.preventDefault(); const st = e.shiftKey ? 10 : 1; const dx = e.key === 'ArrowLeft' ? -st : e.key === 'ArrowRight' ? st : 0, dy = e.key === 'ArrowUp' ? -st : e.key === 'ArrowDown' ? st : 0;
    S.els.forEach((x) => { if (S.sel.has(x.id)) { x.x += dx; x.y += dy; } }); changed(); return;
  }
  if (!e.shiftKey && !e.altKey && k === 'i') { pickFiles((f) => addFilesToBoard(f)); return; }
  if (!e.shiftKey && !e.altKey && KEYMAP[k] !== undefined) setTool(KEYMAP[k]);
});
window.addEventListener('keyup', (e) => { if (e.key === ' ') { S.space = false; cv.style.cursor = S.tool === 'hand' ? 'grab' : 'default'; } });

/* ================= Montagem ================= */
function setTheme(t) {
  if (t === 'system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t);
  lsSet('planta.theme', t); paintThemeSeg(t);
}
function paintThemeSeg(t) {
  $('#themeSeg').innerHTML = [['system', 'auto', 'Automático'], ['light', 'sun', 'Claro'], ['dark', 'moon', 'Escuro']].map(([k, i, l]) => `<button class="${t === k ? 'on' : ''}" data-th="${k}" title="${l}" aria-label="Tema ${l}">${ic(i)}</button>`).join('');
  $('#themeSeg').querySelectorAll('button').forEach((b) => (b.onclick = () => setTheme(b.dataset.th)));
}
function initChrome() {
  $('#closeSide').innerHTML = ic('side'); $('#openSide').innerHTML = ic('side'); $('#searchIc').innerHTML = ic('search');
  $('#sideNew').innerHTML = ic('plus'); $('#keysBtn').innerHTML = ic('keys'); $('#moreBtn').innerHTML = ic('more');
  $('#libBtn').innerHTML = `${ic('lib')}<span class="hide-sm">Ferramentas</span>`;
  $('#presentBtn').innerHTML = `${ic('play')}<span>Apresentar</span>`;
  $('#videoBtn').innerHTML = `${ic('video')}<span class="hide-sm">Vídeo</span>`;
  $('#videoBtn').onclick = (e) => videoMenu(e.currentTarget);
  $('#viewSeg').innerHTML = [['board', 'board', 'Quadro'], ['split', 'split', 'Dividido'], ['page', 'page', 'Página']].map(([v, i, l]) => `<button data-v="${v}" class="${v === 'split' ? 'seg-split' : ''}" title="${l}">${ic(i)}<span class="hide-sm">${l}</span></button>`).join('');
  $('#viewSeg').querySelectorAll('button').forEach((b) => (b.onclick = () => setView(b.dataset.v)));
  $('#navHome').onclick = openHome; $('#crumbHome').onclick = openHome;
  $('#sideNew').onclick = openNewModal; $('#keysBtn').onclick = openKeysModal;
  $('#moreBtn').onclick = (e) => moreMenu(e.currentTarget);
  $('#libBtn').onclick = () => toggleLib(); $('#presentBtn').onclick = () => togglePresent();
  const small = () => matchMedia('(max-width:860px)').matches;
  $('#closeSide').onclick = () => { if (small()) closeSideMobile(); else { $('#app').classList.add('side-closed'); lsSet('planta.side', false); } setTimeout(resizeCanvas, 260); };
  $('#openSide').onclick = () => { if (small()) $('#app').classList.add('side-open'); else { $('#app').classList.toggle('side-closed'); lsSet('planta.side', !$('#app').classList.contains('side-closed')); } setTimeout(resizeCanvas, 260); };
  $('#scrim').onclick = closeSideMobile;
  if (lsGet('planta.side', true) === false) $('#app').classList.add('side-closed');
  $('#projList').addEventListener('click', (e) => { const b = e.target.closest('.pitem'); if (b) openProject(b.dataset.id); });
  $('#q').addEventListener('input', (e) => { S.q = e.target.value; renderSide(); renderHome(); });
  paintThemeSeg(lsGet('planta.theme', 'system'));
  S.style.toolShow = ['logo', 'both', 'name'].includes(lsGet('planta.toolShow', 'both')) ? lsGet('planta.toolShow', 'both') : 'both';
  const th = lsGet('planta.theme', 'system'); if (th !== 'system') document.documentElement.setAttribute('data-theme', th);
  renderToolbar(); setTool('select');
}
const onTheme = () => { readPalette(); req(); };
function setActBlock(id) {
  S.actBlock = id;
  document.querySelectorAll('#blocks .blk').forEach((r) => r.classList.toggle('act', r.dataset.id === id));
}
$('#pagePane').addEventListener('focusin', (e) => { const r = e.target.closest('#blocks .blk'); if (r) setActBlock(r.dataset.id); });
$('#pagePane').addEventListener('pointerdown', (e) => { const r = e.target.closest('#blocks .blk'); if (r) setActBlock(r.dataset.id); else if (!e.target.closest('.bbar')) setActBlock(null); });
$('#pagePane').addEventListener('dragover', (e) => { if (e.dataTransfer.types.includes('Files')) { e.preventDefault(); $('#pagePane').classList.add('drop'); } });
$('#pagePane').addEventListener('dragleave', (e) => { if (!$('#pagePane').contains(e.relatedTarget)) $('#pagePane').classList.remove('drop'); });
$('#pagePane').addEventListener('drop', (e) => {
  $('#pagePane').classList.remove('drop');
  if (e.dataTransfer.files && e.dataTransfer.files.length) { e.preventDefault(); addFilesToPage([...e.dataTransfer.files], S.actBlock); }
});
new MutationObserver(onTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', onTheme);
new ResizeObserver(() => { resizeCanvas(); if (S.editing) placeEditor(); if (S.video) sizeStage(); }).observe($('#boardPane'));
window.addEventListener('beforeunload', () => { if (S.dirty.size) flush(); });

initChrome(); readPalette(); resizeCanvas();
if (document.fonts && document.fonts.load) document.fonts.load('20px "Kalam"').then(() => { remeasureTexts(); RC.clear(); req(); }).catch(() => {});
initStore();
})();
</script>
